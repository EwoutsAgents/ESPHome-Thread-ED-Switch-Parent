esphome:
  name: stock-child
  friendly_name: stock-child

esp32:
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_OPENTHREAD_PARENT_SEARCH_MTD: n  # explicitly disables ESP-IDF/OpenThread's default MTD periodic parent-search feature
    log_level: INFO

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

network:
  enable_ipv6: true

text_sensor:
  - platform: openthread_info
    ext_addr:
      name: "Thread Extended Address"
      on_value:
        then:
          - logger.log:
              level: INFO
              format: "Own Thread ExtAddr: %s"
              args: ["x.c_str()"]

globals:
  - id: stock_parent_extaddr_logged
    type: bool
    restore_value: no
    initial_value: "false"

interval:
  - interval: 500ms
    then:
      - lambda: |-
          if (id(stock_parent_extaddr_logged)) {
            return;
          }

          auto lock = esphome::openthread::InstanceLock::try_acquire(0);
          if (!lock.has_value()) {
            return;
          }

          if (otThreadGetDeviceRole(lock->get_instance()) < OT_DEVICE_ROLE_CHILD) {
            return;
          }

          otRouterInfo parent_info{};
          if (otThreadGetParentInfo(lock->get_instance(), &parent_info) != OT_ERROR_NONE) {
            return;
          }

          char parent_extaddr[17] = {};
          for (size_t i = 0; i < OT_EXT_ADDRESS_SIZE; i++) {
            snprintf(parent_extaddr + (i * 2), sizeof(parent_extaddr) - (i * 2), "%02x", parent_info.mExtAddress.m8[i]);
          }

          ESP_LOGI("stock_child_parent", "Current parent ExtAddr: %s", parent_extaddr);
          id(stock_parent_extaddr_logged) = true;
              
openthread:
  device_type: MTD
  channel: 20
  network_name: parent-switch
  network_key: 0xdfd34f0f05cad978ec4e32b0413038ff
  pan_id: 0x8f28
  ext_pan_id: 0xd63e8e3e495ebbc3
  pskc: 0xc23a76e98f1a6483639b1ac1271e2e27
  mesh_local_prefix: fd53:145f:ed22:ad81::/64
  force_dataset: true
