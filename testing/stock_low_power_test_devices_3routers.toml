# Three-router stock-low-power test configuration.

[devices]
router1 = "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_58:8C:81:5D:B0:C4-if00"
child = "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_58:8C:81:5D:B0:E0-if00"
router2 = "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_58:8C:81:5D:B1:54-if00"
unused1 = "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_58:8C:81:5F:D8:C4-if00"
unused2 = "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_58:8C:81:5F:D9:28-if00"

[variant]
name = "stock-low-power"
# Total number of stock-low-power router-capable devices included in the run.
# This does not include the child.
#
# n_routers = 2 means:
#   stock_low_power_router_1.yaml + stock_low_power_router_2.yaml + stock_low_power_child.yaml
#
# n_routers = 3 means:
#   stock_low_power_router_1.yaml + stock_low_power_router_2.yaml + stock_low_power_router_3.yaml + stock_low_power_child.yaml
#
# n_routers = 4 means:
#   stock_low_power_router_1.yaml + stock_low_power_router_2.yaml + stock_low_power_router_3.yaml + stock_low_power_router_4.yaml + stock_low_power_child.yaml
n_routers = 3
[paths]
configs_dir = "configs"
logs_dir = "logs/stock-low-power"

[esphome]
precompile = true
clean_before_compile = false

[timing]
sniffer_lead_in_seconds = 5
# after_router1_seconds = 5  # obsolete: routers are flashed before the child
child_attach_seconds = 5
router_settling_seconds = 180
after_parent_removed_seconds = 255

[sniffer]
enabled = true
command = ["ssh", "rpi-802154-sniffer", "~/bin/nrf802154-sniff"]
stop_timeout_seconds = 10
